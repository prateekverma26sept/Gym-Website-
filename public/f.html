<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Font Example</title>
    <style>
        /* Import Your Own Font */
        @font-face {
            font-family: 'MyCustomFont';
            src: url('./fonts/Newton Howard Font (1).woff2') format('woff2'),
                 url('./fonts/Newton Howard Font (1).woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        /* Apply Custom Font */
        body {
            font-family: 'MyCustomFont', sans-serif;
            background-color: #1b1b1b;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }

        h1 {
            font-size: 3.5rem;
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.3);
        }

        p {
            font-size: 1.5rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Welcome to V.S Gym</h1>
    

</body>
</html>
