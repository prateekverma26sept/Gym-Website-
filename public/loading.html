<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V.S Gym</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    @font-face {
      font-family: 'MyCustomFont';
      src: url('./fonts/Newton Howard Font (1).woff2') format('woff2'),
           url('./fonts/Newton Howard Font (1).woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    body {
      font-family: 'MyCustomFont', sans-serif;
      background-color: #1b1b1b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      flex-direction: column;
      overflow: hidden;
    }

    /* Background Image */
    .background {
      background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3IZuiM_wwjQ3QdGbflkc8psbShMF07cw8NA&s') no-repeat center center/cover;
      filter: blur(5px) brightness(0.8);
      height: 100%; width: 100%; position: absolute; z-index: -3;
    }

    /* Grid Overlay */
    .grid-background {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(20, 1fr);
      z-index: -2;
    }

    .grid-background::before {
      content: "";
      position: absolute;
      width: 100%; height: 100%;
      background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), 
                        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: moveGrid 8s linear infinite;
    }

    @keyframes moveGrid {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50px, -50px); }
    }

    /* Overlay */
    .overlay {
      background-color: rgba(0, 0, 0, 0.5);
      position: absolute; height: 100%; width: 100%; z-index: -1;
    }

    .content {
      position: relative; z-index: 1; height: 100%;
      display: flex; justify-content: center; align-items: center; flex-direction: column;
      color: white; text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 5.5rem;
      text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.3);
      margin-bottom: 50px;
    }

    /* Gym Themed Button */
    .loading-button {
      padding: 18px 50px;
      font-size: 1.3rem;
      font-weight: bold;
      text-transform: uppercase;
      background: #D60000;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(214, 0, 0, 0.8);
      transition: all 0.3s ease-out;
      outline: none;
      position: absolute;
      left: -200px;
      margin-top: 180px;
    }

    .loading-button:hover {
      background: black;
      color: red;
      box-shadow: 0 0 20px red;
    }

    .loading-button:active {
      transform: scale(0.95);
    }

    .loading-button span {
      display: inline-block;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="background"></div>
  <div class="grid-background"></div>
  <div class="overlay"></div>

  <!-- Content -->
  <div class="content">
    <h1>Welcome to V.S Gym</h1>
    <button class="loading-button">
      <span>Loading: 0%</span>
    </button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const button = document.querySelector('.loading-button');
      let progress = 0;
      const duration = 6;

      let finalX = window.innerWidth * 0.7;

      // GSAP animation: Move the button
      gsap.to(button, {
        x: finalX,
        duration: duration,
        ease: "linear"
      });

      // Preload the target page
      const preloadLink = document.createElement('link');
      preloadLink.rel = 'prefetch';
      preloadLink.href = 'index.html';
      document.head.appendChild(preloadLink);

      // Loading percentage update
      const interval = setInterval(() => {
        progress++;
        button.querySelector('span').textContent = `Loading: ${progress}%`;

        if (progress >= 100) {
          clearInterval(interval);
          window.location.href = 'index.html';
        }
      }, (duration * 1000) / 100);
    });
  </script>

</body>
</html>
